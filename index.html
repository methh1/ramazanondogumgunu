<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ramazan'ın Doğum Günü 🎉</title>
<style>
  *{ box-sizing: border-box; margin:0; padding:0; }
  html, body{
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  body{
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    background: linear-gradient(270deg,
      #ff5f6d, #ffc371, #f9f871, #6dd5ed, #7367f0, #d16ba5, #ff5f6d);
    background-size: 1400% 1400%;
    animation: rainbowMove 18s ease infinite;
  }
  @keyframes rainbowMove{
    0%{ background-position: 0% 50%; }
    50%{ background-position: 100% 50%; }
    100%{ background-position: 0% 50%; }
  }

  /* start overlay, needed so browser allows audio to play */
  #start-overlay{
    position: fixed; inset:0;
    background: rgba(20,10,30,0.75);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index: 100;
    gap: 22px;
    text-align: center;
    padding: 20px;
  }
  #start-overlay h2{ color:#fff; font-size: 1.6rem; }
  #start-btn{
    font-size: 1.1rem;
    font-weight: 700;
    padding: 16px 36px;
    border-radius: 999px;
    border: none;
    background: #fff;
    color: #7367f0;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    transition: transform .15s;
  }
  #start-btn:hover{ transform: scale(1.06); }

  .stage{
    position: relative;
    display:flex;
    flex-direction: column;
    align-items:center;
    gap: 26px;
    z-index: 5;
    padding: 20px;
  }

  .photo-wrap{
    border-radius: 50%;
    overflow: hidden;
    border: 6px solid rgba(255,255,255,0.85);
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    cursor: pointer;
    user-select: none;
    transition: width .28s ease, height .28s ease, transform .12s ease;
    width: 200px;
    height: 200px;
    flex-shrink: 0;
  }
  .photo-wrap:active{ transform: scale(0.97); }
  .photo-wrap img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display:block;
    pointer-events: none;
  }

  .caption{
    color: #fff;
    text-align: center;
    text-shadow: 0 3px 12px rgba(0,0,0,0.35);
  }
  .caption h1{
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    margin-bottom: 8px;
  }
  .caption p{
    font-size: 1.05rem;
    opacity: 0.95;
  }
  .counter{
    margin-top: 6px;
    font-size: 0.9rem;
    color: #fff;
    opacity: 0.85;
    font-variant-numeric: tabular-nums;
  }

  #celebrate-msg{
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%) scale(0.7);
    background: rgba(255,255,255,0.95);
    color: #d1408a;
    padding: 34px 44px;
    border-radius: 24px;
    font-size: clamp(1.4rem, 5vw, 2.4rem);
    font-weight: 800;
    text-align: center;
    box-shadow: 0 25px 70px rgba(0,0,0,0.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity .4s ease, transform .4s ease;
    z-index: 60;
    max-width: 90vw;
  }
  #celebrate-msg.show{
    opacity: 1;
    transform: translate(-50%,-50%) scale(1);
  }

  .confetti-piece{
    position: fixed;
    top: 0; left: 0;
    width: 10px; height: 14px;
    pointer-events: none;
    z-index: 40;
    will-change: transform, opacity;
  }

  #sound-toggle{
    position: fixed;
    bottom: 20px; right: 20px;
    background: rgba(255,255,255,0.85);
    border: none;
    border-radius: 999px;
    padding: 10px 16px;
    font-size: 0.85rem;
    cursor: pointer;
    z-index: 30;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
  }

  #debug-status{
    position: fixed;
    top: 10px; left: 10px;
    background: rgba(0,0,0,0.75);
    color: #fff;
    font-size: 0.72rem;
    font-family: monospace;
    padding: 8px 12px;
    border-radius: 8px;
    max-width: 90vw;
    z-index: 90;
    white-space: pre-wrap;
  }

  @media (prefers-reduced-motion: reduce){
    body{ animation: none; }
    .photo-wrap{ transition: none; }
  }
</style>
</head>
<body>

<div id="start-overlay">
  <h2>Ramazan için hazırlanan küçük bir sürpriz var 🎁</h2>
  <button id="start-btn">Başlat 🎶</button>
</div>

 alt="Ramazan'ın fotoğrafı">
  </div>
  <div class="caption">
    <h1>🎂 Ramazan'ın Doğum Günü 🎂</h1>
    <p>Ramazan'ın doğum gününü kutlamak için tıkla 🎉</p>
    <div class="counter" id="counter">0 kere tıklandı</div>
  </div>
</div>

<audio id="bg-music" src="music.mp3"></audio>

<div id="celebrate-msg">Doğum günün kutlu olsun Ramazan! 🎂🎉</div>

<script>
  const photo = document.getElementById('photo-wrap');
  const counterEl = document.getElementById('counter');
  const celebrateMsg = document.getElementById('celebrate-msg');
  const music = document.getElementById('bg-music');
  const startOverlay = document.getElementById('start-overlay');
  const startBtn = document.getElementById('start-btn');
  const soundToggle = document.getElementById('sound-toggle');
  const debugEl = document.getElementById('debug-status');

  function setDebug(msg){
    if (debugEl) debugEl.textContent = 'durum: ' + msg;
  }

  const originalSrc = music.getAttribute('src');
  setDebug('src uzunluğu: ' + (originalSrc ? originalSrc.length : 0) + ' (data URI kullanılıyor)');
  music.load();

  music.addEventListener('error', () => {
    const code = music.error ? music.error.code : 'bilinmiyor';
    const codeNames = {1:'ABORTED',2:'NETWORK',3:'DECODE',4:'SRC_NOT_SUPPORTED'};
    setDebug('AUDIO ELEMENT HATASI: kod ' + code + ' (' + (codeNames[code]||'?') + ')');
  });

  music.addEventListener('canplay', () => {
    setDebug('ses yüklendi, çalmaya hazır (süre: ' + music.duration.toFixed(1) + 's)');
  });

  music.addEventListener('playing', () => {
    setDebug('ŞU AN ÇALIYOR ✓');
  });

  const BASE_SIZE = 200;
  const MAX_SIZE = 460;
  const GROW_STEP = 14;
  const CELEBRATE_AT = 15;

  let clicks = 0;
  let celebrated = false;

  startBtn.addEventListener('click', () => {
    startOverlay.style.display = 'none';
    music.volume = 0.55;
    setDebug('play() çağrıldı...');
    const playPromise = music.play();
    if (playPromise && playPromise.then){
      playPromise.then(() => {
        setDebug('play() başarılı, paused=' + music.paused);
      }).catch((err) => {
        setDebug('play() REDDEDİLDİ: ' + err.name + ' - ' + err.message);
        soundToggle.textContent = '🔇 Sesi Aç (dokun)';
      });
    }
  });

  soundToggle.addEventListener('click', () => {
    if (music.paused){
      const p = music.play();
      if (p && p.catch){
        p.catch((err) => console.error('Müzik başlatılamadı:', err));
      }
      soundToggle.textContent = '🔊 Sesi Kapat';
    } else {
      music.pause();
      soundToggle.textContent = '🔇 Sesi Aç';
    }
  });

  const confettiColors = ['#ff5f6d','#ffc371','#f9f871','#6dd5ed','#7367f0','#d16ba5','#ffffff'];

  function burstConfetti(x, y, amount){
    for (let i = 0; i < amount; i++){
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = x + 'px';
      piece.style.top = y + 'px';
      piece.style.background = confettiColors[Math.floor(Math.random()*confettiColors.length)];
      const shapeRoll = Math.random();
      piece.style.borderRadius = shapeRoll > 0.6 ? '50%' : '2px';

      const angle = Math.random() * Math.PI * 2;
      const distance = 120 + Math.random() * 220;
      const dx = Math.cos(angle) * distance;
      const dy = Math.sin(angle) * distance - 80;
      const rotate = (Math.random() * 720 - 360);
      const duration = 900 + Math.random() * 700;

      document.body.appendChild(piece);

      const anim = piece.animate([
        { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
        { transform: `translate(${dx}px, ${dy + 260}px) rotate(${rotate}deg)`, opacity: 0 }
      ], {
        duration: duration,
        easing: 'cubic-bezier(.25,.8,.3,1)'
      });

      anim.onfinish = () => piece.remove();
    }
  }

  function showCelebration(){
    celebrateMsg.classList.add('show');
    burstConfetti(window.innerWidth/2, window.innerHeight/2, 90);
    setTimeout(() => celebrateMsg.classList.remove('show'), 3200);
  }

  photo.addEventListener('click', (e) => {
    clicks++;
    counterEl.textContent = clicks + ' kere tıklandı';

    const rect = photo.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;
    burstConfetti(cx, cy, 26);

    const newSize = Math.min(MAX_SIZE, BASE_SIZE + clicks * GROW_STEP);
    photo.style.width = newSize + 'px';
    photo.style.height = newSize + 'px';

    if (clicks >= CELEBRATE_AT && !celebrated){
      celebrated = true;
      showCelebration();
    } else if (celebrated && clicks % 10 === 0){
      showCelebration();
    }
  });
</script>

</body>
</html>
